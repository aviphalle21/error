<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Registration Verification</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background-color: #059669; padding: 20px; text-align: center; color: white; }
        .header h1 { margin: 0; font-size: 24px; }
        .content { padding: 30px; color: #374151; line-height: 1.6; }
        .otp-box { background-color: #f8fafc; border: 2px dashed #34d399; border-radius: 8px; padding: 20px; text-align: center; margin: 25px 0; }
        .otp-code { font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #047857; margin: 0; }
        .footer { background-color: #f9fafb; padding: 20px; text-align: center; font-size: 12px; color: #6b7280; border-top: 1px solid #e5e7eb; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Saraswati Abhyasika</h1>
        </div>
        <div class="content">
            <p>Welcome, <strong>{{userName}}</strong>!</p>
            <p>We're thrilled to have you. Please verify your email address to activate your account by using the OTP below:</p>
            
            <div class="otp-box">
                <p class="otp-code">{{verifyUrl}}</p>
            </div>
            
            <p>If you did not register for an account, please ignore this email.</p>
        </div>
        <div class="footer">
            <p>&copy; 2026 Saraswati Abhyasika. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
